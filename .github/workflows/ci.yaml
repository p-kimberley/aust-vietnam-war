name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    # A real MySQL, for the tests of full-text search (which is MySQL's own). They make and drop a database of their own.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -uroot -proot --silent" --health-interval=5s --health-retries=20
    env:
      AVW_TEST_MYSQL: Server=127.0.0.1;Port=3306;User=root;Password=root;CharSet=utf8mb4
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: server/global.json
      - run: dotnet restore Avw.slnx
      - run: dotnet build Avw.slnx --no-restore -c Release
      - run: dotnet test Avw.slnx --no-build -c Release
      - name: Fail on packages with known vulnerabilities
        run: |
          dotnet list Avw.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
      - name: Fail on high-severity advisories in what ships
        run: npm audit --omit=dev --audit-level=high

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render every chart
        run: |
          for chart in deploy/helm/*/; do
            helm lint "$chart"
            helm template avw "$chart" > /dev/null
          done
      - name: Render with the media and scratch volumes enabled
        run: helm template avw deploy/helm/avw-api --set media.enabled=true --set scratch.enabled=true > /dev/null
      - name: Render the one-off import job, both ways
        run: |
          helm template avw deploy/helm/avw-api --set import.enabled=true > /dev/null
          helm template avw deploy/helm/avw-api --set import.enabled=true --set import.dryRun=false --set import.legacyFiles.existingClaim=legacy-uploads > /dev/null
      - name: Check the rendered manifests against the Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for chart in deploy/helm/*/; do
            helm template avw "$chart" --set import.enabled=true | ./kubeconform -strict -summary -ignore-missing-schemas
          done

  images:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
