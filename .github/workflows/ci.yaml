name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read
  packages: write

# server and web run inside a container image rather than on the runner's own Ubuntu userland, and neither image is Ubuntu:
#   .NET   Microsoft's SDK image on Azure Linux 3.0 (and, for the images that ship, its distroless ASP.NET image; see server/Dockerfile)
#   web    Node's own Debian image (and Google's distroless Node to ship; see web/Dockerfile)
# `runs-on: ubuntu-latest` is the GitHub-hosted machine that starts those containers (it cannot be changed without a self-hosted runner).
# helm runs directly on that Ubuntu runner instead of in a container: Azure Linux's own package mirror (tdnf) has proven too flaky
# from GitHub's network for a job that needs nothing from it beyond Helm, git and tar, all of which Ubuntu already has or gets
# from a maintained action.
#
# The `images` and `helm` jobs also publish to ghcr.io, but only on a push to master or develop (never a pull_request, so a fork's
# PR cannot publish under this repo's name): container images once they have passed the checks below them, tagged with the short
# commit SHA and floated to the branch name; each chart once it has passed lint and render, versioned as its Chart.yaml version
# plus that same SHA, so nothing already published is ever overwritten.

jobs:
  server:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-azurelinux3.0
      env:
        DOTNET_NOLOGO: "1"
        DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    # A real MySQL, for the tests of full-text search (which is MySQL's own). They make and drop a database of their own. In a container
    # job the service is reached by its name, not by 127.0.0.1.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        options: --health-cmd="mysqladmin ping -uroot -proot --silent" --health-interval=5s --health-retries=20
    env:
      AVW_TEST_MYSQL: Server=mysql;Port=3306;User=root;Password=root;CharSet=utf8mb4
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      # The SDK comes with the image; server/global.json says which version is wanted, and the build fails if the image is older.
      - run: dotnet restore Avw.slnx
      - run: dotnet build Avw.slnx --no-restore -c Release
      - run: dotnet test Avw.slnx --no-build -c Release
      - name: Fail on packages with known vulnerabilities
        run: |
          dotnet list Avw.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

  web:
    runs-on: ubuntu-latest
    container:
      image: node:24-trixie-slim
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
      - name: Fail on high-severity advisories in what ships
        run: npm audit --omit=dev --audit-level=high

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Lint and render every chart
        run: |
          for chart in deploy/helm/*/; do
            helm lint "$chart"
            helm template avw "$chart" > /dev/null
          done
      - name: Render with the media and scratch volumes enabled
        run: helm template avw deploy/helm/avw-api --set media.enabled=true --set scratch.enabled=true > /dev/null
      - name: Render the one-off import job, every way
        run: |
          helm template avw deploy/helm/avw-api --set import.enabled=true > /dev/null
          helm template avw deploy/helm/avw-api --set import.enabled=true --set import.dryRun=false --set import.legacyFiles.existingClaim=legacy-uploads > /dev/null
          helm template avw deploy/helm/avw-api --set import.enabled=true --set import.command=import-roll --set elasticsearch.caSecret=es-ca > /dev/null
      - name: Check the rendered manifests against the Kubernetes schemas
        run: |
          # Pinned by version and by checksum: a tool that reads the manifests should not be whatever a download happens to return.
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c -
          tar xz -f kubeconform.tar.gz kubeconform
          for chart in deploy/helm/*/; do
            helm template avw "$chart" --set import.enabled=true | ./kubeconform -strict -summary -ignore-missing-schemas
            helm template avw "$chart" --set import.enabled=true --set import.command=import-roll --set elasticsearch.caSecret=es-ca | ./kubeconform -strict -summary -ignore-missing-schemas
          done
      - name: Publish the charts to GHCR
        if: github.event_name == 'push'
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sha=$(echo "${{ github.sha }}" | cut -c1-12)
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          mkdir -p release-artifacts
          for chart in deploy/helm/*/; do
            base=$(sed -n 's/^version: *//p' "$chart/Chart.yaml")
            # Each push gets its own chart version -- the Chart.yaml version, suffixed with the commit -- so nothing already
            # published is overwritten and a values file can pin to an exact one, matching how the images above are tagged.
            helm package "$chart" --app-version "$sha" --version "$base-$sha" --destination release-artifacts
          done
          for pkg in release-artifacts/*.tgz; do
            helm push "$pkg" "oci://ghcr.io/$owner/charts"
          done

  # Building an image needs Docker on the machine that runs the job, so this is the one job that is not itself in a container. What it
  # builds is: the Dockerfiles use only the hardened base images above, and a build that pulled anything else would be a change to them.
  images:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          tags: avw-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          tags: avw-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: The base images are the hardened ones (not Debian or Ubuntu userlands with a shell)
        run: |
          # Distroless: there is no shell to run. If one of these succeeds, the image is not what it is meant to be. (A `!` in front of a
          # command does not stop a script that has `set -e`, so this is spelled out.)
          for image in avw-server:ci avw-web:ci; do
            if docker run --rm --entrypoint /bin/sh "$image" -c true 2> /dev/null; then
              echo "$image has a shell"
              exit 1
            fi
          done
      - name: The server image runs as a non-root user and starts each of its programs
        run: |
          test "$(docker inspect --format '{{.Config.User}}' avw-server:ci)" != "0"
          # The chart starts each program as `dotnet <dll>`. Each refuses to start without its settings, and says so: enough to show that the
          # runtime and its libraries are there.
          docker run --rm --entrypoint dotnet avw-server:ci /app/migrator/Avw.Migrator.dll 2>&1 | grep -q "ConnectionStrings__Default is not set"
      - name: The web image serves its health check
        run: |
          docker run -d --name web -p 4000:4000 avw-web:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:4000/healthz && exit 0; sleep 1; done
          docker logs web
          exit 1
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the images that passed the checks above
        if: github.event_name == 'push'
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sha=$(echo "${{ github.sha }}" | cut -c1-12)
          for name in avw-server avw-web; do
            docker tag "$name:ci" "ghcr.io/$owner/$name:$sha"
            docker tag "$name:ci" "ghcr.io/$owner/$name:${{ github.ref_name }}"
            docker push "ghcr.io/$owner/$name:$sha"
            docker push "ghcr.io/$owner/$name:${{ github.ref_name }}"
          done
