# The realm definition lives in files/avw-realm.json, which docker compose also mounts for local development.
# ${AVW_PUBLIC_URL} is filled in here; ${AVW_CLIENT_SECRET} is resolved by the operator from a Secret so the
# secret never appears in the rendered chart.
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: avw-realm
  labels:
    app.kubernetes.io/name: avw-keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  keycloakCRName: {{ .Values.keycloak.crName }}
  placeholders:
    AVW_CLIENT_SECRET:
      secret:
        name: {{ .Values.clientSecret.secretName }}
        key: {{ .Values.clientSecret.key }}
  realm: {{ .Files.Get "files/avw-realm.json" | replace "${AVW_PUBLIC_URL}" (.Values.publicUrl | trimSuffix "/") | fromJson | toJson }}
