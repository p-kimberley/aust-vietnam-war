image:
  repository: avw-web
  tag: ""                       # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Public host. Must match the ingress host: the SSR server rejects any other Host header (SSRF guard).
host: vietnam-war.au

# Where server-side rendering reaches the API inside the cluster (the avw-api Service).
apiInternalUrl: http://avw-api
# Public address of the site. Empty means https://<host>.
publicUrl: ""

replicas: 2

# Keeps a pod serving while nodes are drained. Only applies with more than one replica.
pdb:
  enabled: true
  minAvailable: 1

# Content security policy for the site's pages. `report-only` watches without blocking, and the API logs what would have been
# blocked (search the logs for "CSP"); switch to `enforce` once that has been quiet through a normal week. `off` sends none.
csp:
  mode: report-only
  # Other hosts the map fetches from: the tile server for the basemaps and, if used, the elevation tiles and GeoServer.
  extraOrigins:
    - https://tiles.hosting.gradata.com.au
    - https://s3.amazonaws.com
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 384Mi }

service:
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations: {}
  tls:
    enabled: true
    secretName: avw-tls

# The distroless Node image's user is `nonroot` (UID 65532).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile: { type: RuntimeDefault }

nodeSelector: {}
tolerations: []
affinity: {}
