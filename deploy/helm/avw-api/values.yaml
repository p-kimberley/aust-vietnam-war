# MySQL, Elasticsearch, Keycloak and GeoServer are external. This chart only needs their addresses and secrets.

image:
  repository: avw-server
  tag: ""                       # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Public host. The ingress routes /api here; the avw-web chart routes everything else.
host: vietnam-war.au

auth:
  authority: https://auth.vietnam-war.au/realms/avw
  clientId: avw-api

elasticsearch:
  url: https://elasticsearch.example.internal:9200
  contactsIndex: avw_contacts
  # The nominal roll, read for the honour roll and the personnel charts.
  personnelIndex: avw_nomroll
  # Text searches (contacts, "find", honour roll) reach Elasticsearch on every call, so each client address may make this many a
  # minute, all kinds together. A school or office behind one address shares it.
  searchPermitsPerMinute: 60
  # Secret holding the private CA (key ca.crt) that signed the cluster's certificate, for example the public certs
  # secret the Elasticsearch operator publishes. Leave empty when the certificate is publicly trusted.
  caSecret: ""

# Runtime map catalogue, mounted into the API as /etc/avw/map/map.json and re-read without a restart. Basemaps,
# overlays and terrain are data, so a provider or GeoServer layer can change here without a new image.
# A basemap is either a style (an absolute http(s) URL of MapLibre-compatible style JSON, for example TileServer GL) or,
# for one with no style of its own, plain raster tiles (below is Esri's public, free World Imagery, from the legacy site).
# mapbox:// styles cannot be loaded and the API refuses to start with one. There is no access token: nothing here is sent
# to a vendor beyond the map tiles themselves.
map:
  center: [107.17, 10.55]
  zoom: 8
  basemaps:
    - { id: vintage, name: Vintage, style: "https://tiles.hosting.gradata.com.au/styles/vintage/style.json", default: true }
    - { id: terrain, name: Terrain, style: "https://tiles.hosting.gradata.com.au/styles/terrain/style.json" }
    - { id: bright, name: Bright, style: "https://tiles.hosting.gradata.com.au/styles/bright/style.json" }
    - { id: positron, name: Light, style: "https://tiles.hosting.gradata.com.au/styles/positron/style.json" }
    - { id: dark-matter, name: Dark, style: "https://tiles.hosting.gradata.com.au/styles/dark-matter/style.json" }
    - id: satellite
      name: Satellite
      tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"]
      attribution: "Esri, Maxar, Earthstar Geographics, and the GIS User Community"
  # Raster overlays, off by default; a reader switches one on under "Imagery" beneath the basemap picker.
  overlays:
    - id: 1atf-topo
      name: 1ATF topo
      tiles: ["https://geoserver.hosting.gradata.com.au/geoserver/vietnam/wms?bbox={bbox-epsg-3857}&service=WMS&version=1.1.1&request=GetMap&transparent=true&layers=vietnam:1atf-topo-classic&width=256&height=256&srs=EPSG:3857&format=image/png8"]
  # Elevation for the 3D switch. Unset (null) hides the switch. Either a TileJSON url or explicit tiles, with the
  # encoding of the elevation PNGs (terrarium or mapbox). For example public Terrarium tiles (AWS Open Data):
  #   terrain:
  #     tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"]
  #     encoding: terrarium
  #     tileSize: 256
  #     maxZoom: 15
  #     exaggeration: 1.5
  terrain: null

# Email to the editors when a member adds a note or picture, or sends casualty information. OPTIONAL and off by default: while
# `smtp.host`, `smtp.from` or `notifications.editorEmails` is empty nothing is sent, the API says so at start-up and logs each item
# that is waiting, and editors see everything on the Studio's Moderation page. To turn it on, set all three. If the server needs a
# login, set `smtp.user` and put the password in the secret as Smtp__Password.
smtp:
  host: ""
  port: 587
  useSsl: true
  user: ""
  from: ""                      # for example no-reply@vietnam-war.au
notifications:
  editorEmails: []              # who is told; blind-copied so they cannot see each other
  siteUrl: ""                   # the public address, for links in the email

# Secret holding the sensitive settings, as environment-style keys:
#   ConnectionStrings__Default          e.g. Server=mysql-router;Port=6446;Database=avw;User=avw;Password=...
#   Elasticsearch__ApiKey              optional: base64 API key with read access to the contacts index
#   Auth__ClientSecret                  the avw-api client secret set in Keycloak
#   Smtp__Password                     optional: the password for smtp.user
#   DataProtection__CertificatePassword password of the key-protection certificate
# Create it out of band (sealed-secrets, external-secrets, ...). `create` exists for local clusters only.
secrets:
  existingSecret: avw-api
  create: false
  values: {}

# ASP.NET Data Protection keys (which sign the session cookie) are stored in MySQL and encrypted with this
# certificate. Provide a Secret with a PKCS#12 file named key-protection.pfx, for example:
#   openssl req -x509 -newkey rsa:3072 -nodes -keyout k.pem -out c.pem -days 3650 -subj "/CN=avw-key-protection"
#   openssl pkcs12 -export -inkey k.pem -in c.pem -out key-protection.pfx -passout pass:<password>
#   kubectl create secret generic avw-key-protection --from-file=key-protection.pfx
dataProtection:
  certificateSecret: avw-key-protection

api:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

worker:
  enabled: true                 # always exactly one replica
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

# Applies EF Core migrations before each install and upgrade.
migrate:
  enabled: true

# One-off import of the legacy community content (see docs/runbook.md). Off by default; run it on purpose with
#   helm upgrade avw deploy/helm/avw-api --reuse-values --set import.enabled=true
# Add ConnectionStrings__Legacy (read-only access to the old MySQL) to the secret first.
import:
  enabled: false
  command: import-community     # or import-poi, or import-roll (the nominal roll: reads Elasticsearch once, needs no legacy MySQL)
  dryRun: true                  # report counts only; set false to write
  scratchSize: 2Gi
  # The legacy incident-media/ folder, mounted read-only, so the pictures can be imported too. Leave both empty to skip pictures.
  legacyFiles:
    existingClaim: ""
    nfs: { server: "", path: "" }

# Keeps a pod serving while nodes are drained. Only applies with more than one API replica.
pdb:
  enabled: true
  minAvailable: 1

service:
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    # ingress-nginx refuses request bodies over 1 MB by default, which would reject every picture upload (the limit is 25 MB).
    nginx.ingress.kubernetes.io/proxy-body-size: 30m
    # cert-manager.io/cluster-issuer: letsencrypt
  tls:
    enabled: true
    secretName: avw-tls

# Shared final-image volume, mounted in the API and worker; the API serves it at /media.
media:
  enabled: true
  mountPath: /var/lib/avw/media
  storage:
    type: pvc                   # pvc | existingClaim | nfs
    existingClaim: ""
    pvc: { storageClassName: "", accessModes: [ReadWriteMany], size: 20Gi }   # a CephFS class
    nfs: { server: "", path: "" }
  keepOriginals: false
  # fsGroup is ignored for inline NFS volumes and for CSI drivers with fsGroupPolicy: None (common for CephFS), leaving
  # a root-owned mount the app cannot write to. Prefer fixing ownership once, or on the storage side. As a last resort
  # this adds an init container that chowns the mount to runAsUser:fsGroup and gives the owner rwx on every start
  # (its log shows the owner and mode before and after). It runs as root (with only
  # CHOWN and FOWNER), so a namespace enforcing the "restricted" Pod Security level will reject the pods.
  fixPermissions:
    enabled: false
    recursive: false            # also chown existing files; slow on a large share
    image: mcr.microsoft.com/azurelinux/busybox:1.36

# Per-pod scratch volume for uploads and image processing (API only). Because it is ReadWriteOnce, processing
# happens in the pod that received the upload.
scratch:
  enabled: true
  mountPath: /var/lib/avw/scratch
  type: ephemeralPvc            # ephemeralPvc | emptyDir
  ephemeralPvc:
    storageClassName: ceph-rbd
    accessModes: [ReadWriteOnce]
    size: 5Gi
  emptyDir: { sizeLimit: 5Gi }  # local development
  maxUploadBytes: 26214400
  maxConcurrentUploads: 4

# .NET images run as UID 1654. Adjust fsGroup for your CephFS/NFS export permissions.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1654
  fsGroup: 1654
  seccompProfile: { type: RuntimeDefault }

nodeSelector: {}
tolerations: []
affinity: {}
