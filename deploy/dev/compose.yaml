# Local development stack: MySQL 8.4 and Keycloak 26 with the same realm the cluster uses.
#   docker compose -f deploy/dev/compose.yaml up -d
# Then run the API (dotnet run --project server/src/Avw.Api) and the web app (npm start in web/).
name: avw-dev
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: avw
      MYSQL_USER: avw
      MYSQL_PASSWORD: avw
    ports: ["3307:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uavw", "-pavw", "--silent"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Substituted into ${...} placeholders in the realm file.
      AVW_PUBLIC_URL: http://localhost:4300
      AVW_CLIENT_SECRET: avw-dev-secret
    ports: ["8080:8080"]
    volumes:
      - ../helm/avw-keycloak/files/avw-realm.json:/opt/keycloak/data/import/avw-realm.json:ro

volumes:
  mysql-data:
