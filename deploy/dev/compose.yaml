# Local development stack: MySQL 8.4 and Keycloak 26 with the same realm the cluster uses.
#   docker compose -f deploy/dev/compose.yaml up -d
# Then run the API (dotnet run --project server/src/Avw.Api) and the web app (npm start in web/).
name: avw-dev
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: avw
      MYSQL_USER: avw
      MYSQL_PASSWORD: avw
    ports: ["3307:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uavw", "-pavw", "--silent"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Substituted into ${...} placeholders in the realm file.
      AVW_PUBLIC_URL: http://localhost:4300
      AVW_CLIENT_SECRET: avw-dev-secret
    ports: ["8080:8080"]
    volumes:
      - ../keycloak/avw-realm.json:/opt/keycloak/data/import/avw-realm.json:ro

  # Optional, for trying the search indexer locally: docker compose -f deploy/dev/compose.yaml --profile search up -d
  # then bash deploy/dev/es-init.sh to create the two indexes (with the same mappings as the live ones). Empty, no security: dev only.
  elasticsearch:
    profiles: ["search"]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: ["es-data:/usr/share/elasticsearch/data"]

volumes:
  mysql-data:
  es-data:
